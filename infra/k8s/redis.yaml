apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  clusterIP: None
  selector: {app: redis}
  ports:
    - {name: redis, port: 6379}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels: {app: redis}
  template:
    metadata:
      labels: {app: redis}
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: redis
          image: redis:7.4.11-alpine
          command: [sh, -c]
          args:
            - 'exec redis-server --appendonly yes --appendfsync everysec --requirepass "$REDIS_PASSWORD" --maxmemory 128mb --maxmemory-policy allkeys-lru'
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: {name: feitu-credentials, key: REDIS_PASSWORD}
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef: {name: feitu-credentials, key: REDIS_PASSWORD}
          ports:
            - {name: redis, containerPort: 6379}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: '1', memory: 256Mi}
          readinessProbe:
            exec: {command: [redis-cli, ping]}
            periodSeconds: 10
          livenessProbe:
            exec: {command: [redis-cli, ping]}
            periodSeconds: 20
          volumeMounts:
            - {name: data, mountPath: /data}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: standard
        resources:
          requests: {storage: 1Gi}
